<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MT5 Copy Trader</title>
    
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- إعدادات Tailwind مخصصة للألوان -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0A0E17',    /* لون الخلفية الأساسي */
                        cardBg: '#131924',    /* لون البطاقات */
                        primary: '#1E3A8A',   /* أزرق */
                        accent: '#10B981',    /* أخضر للربح والحالة */
                        danger: '#EF4444'     /* أحمر للخسارة والايقاف */
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-darkBg text-white font-sans flex flex-col h-screen overflow-hidden">

    <!-- الشريط العلوي (Header) -->
    <header class="flex justify-between items-center p-4 bg-cardBg border-b border-gray-800 shrink-0">
        <button class="text-gray-400 hover:text-white">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <h1 class="text-lg font-bold" id="page-title">MT5 Copy Trader</h1>
        <button class="text-gray-400 hover:text-white relative">
            <i class="fa-regular fa-bell text-xl"></i>
            <span class="absolute top-0 right-0 w-2 h-2 bg-danger rounded-full"></span>
        </button>
    </header>

    <!-- منطقة المحتوى الديناميكي (هنا ستظهر الصفحات) -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-24">
        <!-- سيتم جلب محتوى ملفات الـ views هنا عبر الجافاسكريبت -->
    </main>

    <!-- شريط التنقل السفلي (Bottom Navigation) -->
    <nav class="bg-cardBg border-t border-gray-800 fixed bottom-0 w-full flex justify-around items-center p-3 text-xs text-gray-500 shrink-0">
        <button onclick="loadPage('home', 'MT5 Copy Trader')" class="nav-btn active flex flex-col items-center gap-1 text-blue-500" data-target="home">
            <i class="fa-solid fa-house text-xl"></i>
            <span>الرئيسية</span>
        </button>
        <button onclick="loadPage('accounts', 'الحسابات')" class="nav-btn flex flex-col items-center gap-1 hover:text-blue-400" data-target="accounts">
            <i class="fa-solid fa-wallet text-xl"></i>
            <span>الحسابات</span>
        </button>
        <button onclick="loadPage('copy', 'ناسخ الصفقات')" class="nav-btn flex flex-col items-center gap-1 hover:text-blue-400" data-target="copy">
            <i class="fa-solid fa-retweet text-xl"></i>
            <span>النسخ</span>
        </button>
        <button onclick="loadPage('trades', 'الصفقات')" class="nav-btn flex flex-col items-center gap-1 hover:text-blue-400" data-target="trades">
            <i class="fa-solid fa-chart-line text-xl"></i>
            <span>الصفقات</span>
        </button>
        <button onclick="loadPage('more', 'المزيد')" class="nav-btn flex flex-col items-center gap-1 hover:text-blue-400" data-target="more">
            <i class="fa-solid fa-ellipsis text-xl"></i>
            <span>المزيد</span>
        </button>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
